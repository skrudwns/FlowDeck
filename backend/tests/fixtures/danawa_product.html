<!DOCTYPE html>
<!-- 다나와 상품 페이지 구조만 본떠 직접 만든 테스트용 HTML. 상품명, 판매처, 가격은 가짜 값이다. -->
<html>
<head>
<title>테스트 상품 : 다나와 가격비교</title>
<script type="application/ld+json">
{
    "@context": "https://schema.org/",
    "@type": "Product",
    "name": "테스트 상품 A",
    "sku": "1000001",
    "offers": {
        "@type": "AggregateOffer",
        "offerCount": "12",
        "lowPrice": "50000",
        "priceCurrency": "KRW"
    }
}
</script>
</head>
<body>
<ul class="list__mall-price">
  <li class="list-item">
    <div class="box__logo"><img src="//img.example/AAA_logo.gif" class="image" alt="가나몰"></div>
    <div class="box__price lowest">
      <span class="badge__lowest">최저가</span>
      <div class="sell-price" data-base-price="50000" data-delivery-price="0">
        <span class="text__num">50,000</span><span class="text__unit">원</span>
      </div>
    </div>
    <div class="box__delivery"> 무료배송 </div>
    <a href="https://prod.danawa.com/bridge/loadingBridge.html?pcode=1000001&cmpnyc=AAA01&r=1" class="link__full-cover"></a>
  </li>
  <li class="list-item">
    <div class="box__logo">
      <span class="text__logo" role="img" aria-label="다라스토어">다라스토어</span>
      <span class="icon__npay"><span class="blind">네이버페이</span></span>
    </div>
    <div class="box__price ">
      <div class="sell-price"><span class="text__num">51,200</span><span class="text__unit">원</span></div>
    </div>
    <div class="box__delivery"> 배송비 3,000원 </div>
    <a href="https://prod.danawa.com/bridge/loadingBridge.html?pcode=1000001&cmpnyc=BBB02&r=2" class="link__full-cover"></a>
  </li>
</ul>
</body>
</html>
