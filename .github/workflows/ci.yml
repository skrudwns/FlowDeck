name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    services:
      # 수집 실행 테스트가 실제 Postgres에서 돈다 (backend/tests/conftest.py)
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowdeck
          POSTGRES_PASSWORD: flowdeck
          POSTGRES_DB: flowdeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowdeck -d flowdeck_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://flowdeck:flowdeck@localhost:5432/flowdeck_test
      REQUIRE_TEST_DB: "1"

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  mock-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mock-shop
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: mock-shop
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
      # 백엔드 파서 테스트의 HTML이 지금 쇼핑몰이 만드는 HTML과 같은지 본다 (ADR-0010)
      - name: 백엔드 테스트용 HTML이 최신인지 확인
        run: |
          uv run mock-shop fixtures ../backend/tests/fixtures
          git diff --exit-code -- ../backend/tests/fixtures

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # API 타입을 백엔드에서 다시 만들어 커밋된 것과 같은지 본다 (ADR-0009)
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: npm ci
      - name: API 타입이 최신인지 확인
        run: |
          npm run gen:api
          git diff --exit-code -- openapi.json src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      # API 서버 없이 빌드한다. 데이터는 요청 때 채우는 화면이라 빌드에는 필요 없다
      - run: npm run build
