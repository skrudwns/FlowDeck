name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    services:
      # 수집 실행 테스트가 실제 Postgres에서 돈다 (backend/tests/conftest.py)
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowdeck
          POSTGRES_PASSWORD: flowdeck
          POSTGRES_DB: flowdeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowdeck -d flowdeck_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://flowdeck:flowdeck@localhost:5432/flowdeck_test
      REQUIRE_TEST_DB: "1"

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
