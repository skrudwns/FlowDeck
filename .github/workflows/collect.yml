name: 가격 수집

# 실행 위치와 무료 한도: docs/adr/0003-collector-runtime.md
# 수집 원칙: docs/adr/0004-real-data-source-alternatives.md
# 연습 쇼핑몰 수집: docs/adr/0010-mock-shop.md
#
# GitHub Actions 예약 실행(schedule)은 이 저장소에서 돌지 않았다 (TS-0003).
# 그래서 외부 cron 서비스가 매시 17분에 GitHub API로 workflow_dispatch를 호출한다 (ADR-0006).
# 이때 trigger 입력으로 schedule을 넘겨서 실행 기록에서 직접 누른 수동 실행과 구분한다.
# cron-job.org가 이 파일 이름(collect.yml)으로 호출하니 이름을 바꾸지 않는다.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 실행 기록에 남길 실행 종류
        type: choice
        options:
          - manual
          - schedule
        default: manual

# 이전 실행이 아직 돌고 있으면 겹치지 않게 기다린다
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # 두 수집 작업이 동시에 마이그레이션하지 않게 먼저 한 번만 한다
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: DB 스키마 최신으로
        run: uv run alembic upgrade head

  danawa:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 수집 결과 신호 (ADR-0007). 없으면 신호 없이 수집만 한다
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen --no-dev

      - name: 수집 대상 목록 반영
        run: uv run flowdeck products sync targets/danawa.txt

      - name: 수집
        env:
          # 입력값을 명령어에 직접 끼워 넣지 않고 환경 변수로 넘긴다
          TRIGGER: ${{ inputs.trigger }}
        run: uv run flowdeck collect --trigger "$TRIGGER"

  mockshop:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 다나와와 다른 체크로 보낸다 (ADR-0010). 없으면 신호 없이 수집만 한다
      HEALTHCHECK_URL: ${{ secrets.MOCKSHOP_HEALTHCHECK_URL }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen --no-dev

      # 쇼핑몰은 이 작업 안에서만 떠 있다. 가격은 시각으로 정해져서 매번 새로 띄워도 된다
      - name: 연습 쇼핑몰 띄우기
        working-directory: mock-shop
        run: |
          uv sync --frozen --no-dev
          nohup uv run mock-shop serve --port 8020 > "$RUNNER_TEMP/mock-shop.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8020/robots.txt > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/mock-shop.log"
          exit 1

      - name: 수집
        env:
          TRIGGER: ${{ inputs.trigger }}
        run: uv run flowdeck collect --source mockshop --trigger "$TRIGGER"

      - name: 쇼핑몰 로그
        if: always()
        run: cat "$RUNNER_TEMP/mock-shop.log"
