name: 다나와 가격 수집

# 실행 위치와 무료 한도: docs/adr/0003-collector-runtime.md
# 수집 원칙: docs/adr/0004-real-data-source-alternatives.md
#
# GitHub Actions 예약 실행(schedule)은 이 저장소에서 돌지 않았다 (TS-0003).
# 그래서 외부 cron 서비스가 매시 17분에 GitHub API로 workflow_dispatch를 호출한다 (ADR-0006).
# 이때 trigger 입력으로 schedule을 넘겨서 실행 기록에서 직접 누른 수동 실행과 구분한다.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 실행 기록에 남길 실행 종류
        type: choice
        options:
          - manual
          - schedule
        default: manual

# 이전 실행이 아직 돌고 있으면 겹치지 않게 기다린다
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen --no-dev

      - name: DB 스키마 최신으로
        run: uv run alembic upgrade head

      - name: 수집 대상 목록 반영
        run: uv run flowdeck products sync targets/danawa.txt

      - name: 수집
        env:
          # 입력값을 명령어에 직접 끼워 넣지 않고 환경 변수로 넘긴다
          TRIGGER: ${{ inputs.trigger }}
        run: uv run flowdeck collect --trigger "$TRIGGER"
