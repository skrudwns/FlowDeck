# 로컬 개발용. 운영 데이터는 Neon에 쌓는다 (ADR-0003).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: flowdeck
      POSTGRES_PASSWORD: flowdeck
      POSTGRES_DB: flowdeck
    ports:
      # 개발 Mac에서 Homebrew postgresql@18이 5432를 쓰고 있어서 5433으로 연다
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdeck -d flowdeck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
